name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate skills
        run: node scripts/validate-skills.mjs
      - name: Check for credentials
        run: node scripts/check-secrets.mjs
      - name: Check tool names
        # Skipped until the Stacksync MCP build publishes tools.json; then download it here and
        # point STACKSYNC_TOOLS_JSON at it.
        run: node scripts/check-tools.mjs
      - name: Check catalog.json is current
        run: node scripts/generate-catalog.mjs --check
      - name: Test the checks
        run: node --test scripts/test/*.test.mjs
